name: redpanda-agentic-smart-factory

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - factory-network
    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health | grep -q 'Healthy:.*true'
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v3.9.0
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    networks:
      - factory-network

  machine-controller:
    build:
      context: ./machine-controller
    container_name: machine-controller
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKER: redpanda:9092
      COMMANDS_TOPIC: factory.commands
      COMMAND_RESULTS_TOPIC: factory.command-results
      CONSUMER_GROUP: machine-controller-group
      CONTROLLER_ID: machine-controller-01
    networks:
      - factory-network
    restart: unless-stopped

  maintenance-agent:
    build:
      context: ./maintenance-agent
    container_name: maintenance-agent
    depends_on:
      redpanda:
        condition: service_healthy
      machine-controller:
        condition: service_started
    environment:
      KAFKA_BROKER: redpanda:9092
      TELEMETRY_TOPIC: factory.telemetry
      COMMANDS_TOPIC: factory.commands
      DECISIONS_TOPIC: factory.agent-decisions
      CONSUMER_GROUP: maintenance-agent-group
      AGENT_ID: maintenance-agent-01
      STATE_WINDOW_SIZE: "5"
    networks:
      - factory-network
    restart: unless-stopped

  machine-simulator:
    build:
      context: ./machine-simulator
    container_name: machine-simulator
    depends_on:
      redpanda:
        condition: service_healthy
      maintenance-agent:
        condition: service_started
    environment:
      KAFKA_BROKER: redpanda:9092
      TELEMETRY_TOPIC: factory.telemetry
      MACHINE_ID: machine-01
      EVENT_INTERVAL_SECONDS: "2"
      #RANDOM_SEED: "42"
      CORRELATION_PREFIX: abc
      CORRELATION_START: "123"
    networks:
      - factory-network
    restart: "no"

volumes:
  redpanda-data:

networks:
  factory-network:
    driver: bridge